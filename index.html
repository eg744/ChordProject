<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Chord tool</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script async type="text/javascript" src="https://www.scales-chords.com/api/scales-chords-api.js"></script>
    <script src="script.js" defer></script>


</head>

<body>


    <h1 class="title">Main title</h1>

    <div class="main-content">

    </div>
    <div id="piano"></div>
    <label for="chord">Chord:</label>
    <select id="chord" onchange="showChord()">
        <option value="">Choose</option>option

        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>

    </select>

    <!-- <select id="root" onchange="buildChord()">

        <option value="">Choose</option>option

        <option value="C">C</option>

        <option value="B">B</option>

    <select id="quality" onchange="showChord()">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="diminished">Diminished</option>
        <option value="augmented">Augmented</option>
        <option value="sus2">Sus2</option>
        <option value="sus4">Sus4</option>
    </select>

    <select id="seventh" onchange="showChord()">
        <option value="">None</option>
        <option value="dominant7">7</option>
        <option value="major7">Maj7</option>
        <option value="minor7">m7</option>
    </select>

    <label><input type="checkbox" id="add9" onchange="showChord()"> Add 9</label>
    <label><input type="checkbox" id="add11" onchange="showChord()"> Add 11</label>


    <br><br>

    <div id="chord-container">

    </div>

</body>

</html>
