<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Expert Music Chord tool</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script async type="text/javascript" src="https://www.scales-chords.com/api/scales-chords-api.js"></script>
    <script src="script.js" defer></script>


</head>

<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="chordEditor.html">Chord Editor</a>
        <a href="about.html">About</a>
    </nav>


    <h1 class="title">CS312 Individual project: Chord Expert</h1>
    <div class="page">
        <div class="main-content">

        </div>
        <div class="instruments">

            <!-- 🎹 PIANO -->
            <div id="piano-container">
                <h3>Piano</h3>
                <div id="piano"></div>

                <select id="piano-chord" onchange="showPianoChord()">
                    <option value="">Choose</option>

                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="D">D</option>
                    <option value="D#">D#</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F#</option>
                    <option value="G">G</option>
                    <option value="G#">G#</option>
                    <option value="A">A</option>
                    <option value="A#">A#</option>
                    <option value="B">B</option>
                </select>
                <select id="piano-quality" onchange="showPianoChord()">

                    <option value="major">Major</option>
                    <option value="minor">Minor</option>
                    <option value="diminished">Diminished</option>
                    <option value="augmented">Augmented</option>
                    <option value="sus2">Sus2</option>
                    <option value="sus4">Sus4</option>
                </select>

                <select id="piano-seventh" onchange="showPianoChord()">
                    <option value=''>No 7th</option>
                    <option value="dominant7">Dominant 7</option>
                    <option value="major7">Major 7</option>
                    <option value="minor7">Minor 7</option>


                </select>

                <label><input type="checkbox" id="piano-add9" onchange="showPianoChord()"> Add 9</label>
                <label><input type="checkbox" id="piano-add11" onchange="showPianoChord()"> Add 11</label>
            </div>

            <!-- 🎸 GUITAR -->
            <div id="guitar-container">
                <h3>Guitar</h3>
                <div id="guitar">

                </div>


                <select id="guitar-chord" onchange="showGuitarChord()">

                    <option value="">Choose</option>option
                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="D">D</option>
                    <option value="D#">D#</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F#</option>
                    <option value="G">G</option>
                    <option value="G#">G#</option>
                    <option value="A">A</option>
                    <option value="A#">A#</option>
                    <option value="B">B</option>

                </select>
                <select id="guitar-quality" onchange="showGuitarChord()">
                    <option value="major">Major</option>
                    <option value="minor">Minor</option>
                </select>

                <label><input type="checkbox" id="guitar-add9"> Add 9</label>
                <label><input type="checkbox" id="guitar-add11"> Add 11</label>
                <label><button onclick="nextGuitarShape()">Next Shape</button></label>
            </div>

            <br><br>

            <div id="chord-container">

            </div>

            <footer>Created by Elijah Gillit for CS312</footer>
        </div>

</body>

</html>
