<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="chordEditor.html">Chord Editor</a>
        <a href="about.html">About</a>
    </nav>

    <h1>Song Editor</h1>

    <!-- SECTION CONTROLS -->
    <input type="text" id="section-name" placeholder="Section name (Verse 1, Chorus)">
    <button onclick="addSection()">Add Section</button>

    <hr>

    <!-- CHORD PICKER (reuse your existing idea) -->
    <select id="editor-chord-root">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
    </select>

    <select id="editor-quality">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="diminished">Diminished</option>
        <option value="augmented">Augmented</option>
        <option value="sus2">Sus2</option>
        <option value="sus4">Sus4</option>
    </select>

    <button onclick="insertChord()">Insert Chord</button>

    <hr>

    <!-- LYRICS AREA -->
    <div id="song-container"></div>

</body>

</html>
