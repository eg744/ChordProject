<h1>Chord Chart Editor</h1>


<!-- INSTRUMENT SELECT -->
<select id="instrument-select" onchange="renderInstrumentUI()">
    <option value="">Choose Instrument</option>
    <option value="piano">Piano</option>
    <option value="guitar">Guitar</option>
</select>

<div id="instrument-ui"></div>
<br><br>

<!-- SECTION CONTROLS -->
<input class="section-input" type="text" id="section-name" placeholder="Section name (Verse 1, Chorus)" />
<button onclick="addSection()">Add Section</button>

<hr />

<!-- CHORD PICKER -->
<select id="editor-chord-root">
    <option value="C">C</option>
    <option value="C#">C#</option>
    <option value="D">D</option>
    <option value="D#">D#</option>
    <option value="E">E</option>
    <option value="F">F</option>
    <option value="F#">F#</option>
    <option value="G">G</option>
    <option value="G#">G#</option>
    <option value="A">A</option>
    <option value="A#">A#</option>
    <option value="B">B</option>
</select>

<select id="editor-quality">
    <option value="major">Major</option>
    <option value="minor">Minor</option>
    <option value="diminished">Diminished</option>
    <option value="augmented">Augmented</option>
    <option value="sus2">Sus2</option>
    <option value="sus4">Sus4</option>
</select>

<button onclick="insertChord()">Insert Chord</button>

<hr />

<!-- LYRICS -->
<div id="song-container"></div>


</body>
